[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "claude-dashboard"
version = "0.1.0"
description = "Local Claude usage ledger and dashboard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "platformdirs>=4,<5",
    "tzdata>=2025.2",
    "tzlocal>=5,<6",
    "fastapi>=0.142.2,<1",
    "jinja2>=3.1.6,<4",
    "uvicorn>=0.34,<1",
]

[project.scripts]
claude-metrics = "claude_metrics.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.12,<1",
    "hatchling==1.27.0",
    "httpx2>=2.13.1,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/claude_metrics"]

[tool.hatch.build.targets.wheel.force-include]
"data/pricing" = "claude_metrics/data/pricing"

[tool.hatch.build.targets.sdist]
include = ["src", "data", "tests", "docs", "scripts", "README.md", "settings.toml", "pyproject.toml", "uv.lock", ".python-version", ".gitattributes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
